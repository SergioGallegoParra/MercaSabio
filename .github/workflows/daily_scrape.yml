name: Supermarket Daily Scrape

on:
  schedule:
    # 03:00 UTC equivale a las 22:00 hora Colombia (COT, UTC-5)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      store:
        description: 'Tienda específica a ejecutar (vacío = matriz completa)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        store: [exito, carulla, olimpica, d1, ara]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Ejecutar Extractor
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.store == '' || inputs.store == matrix.store }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORE_TARGET: ${{ matrix.store }}
          D1_VTEX_SEGMENT: ${{ vars.D1_VTEX_SEGMENT }}
          ARA_API_URL: ${{ vars.ARA_API_URL }}
          ARA_PDF_URLS: ${{ vars.ARA_PDF_URLS }}
          RAPPI_GUEST_TOKEN: ${{ secrets.RAPPI_GUEST_TOKEN }}
        run: python -m etl.main --store "$STORE_TARGET"

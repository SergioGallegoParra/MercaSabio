[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comparador-precios-colombia"
version = "0.1.0"
description = "Pipeline ETL, homologación en cascada y esquema Supabase para comparador de precios retail en Colombia."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "supabase>=2.5.0,<3.0.0",
    "pypdf>=4.0.0,<6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["etl*"]
